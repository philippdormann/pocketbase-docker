name: Release on pocketbase/release
on:
  schedule:
    # Rebuild check every hour — picks up new ganigeorgiev.com/pocketbase releases automatically
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (empty = latest pocketbase release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      pocketbase: ${{ steps.pocketbase.outputs.result }}
      package: ${{ steps.package.outputs.result }}
    steps:
      - name: Get latest pocketbase release
        id: pocketbase
        run: |
          set -e
          API="https://ganigeorgiev.com/api/collections"
          PROJECT_ID=$(curl -sSL --max-time 30 -G "$API/projects/records" \
            --data-urlencode 'filter=name="pocketbase"' \
            --data-urlencode 'perPage=5' | jq -r '.items[0].id')
          echo "Project ID: $PROJECT_ID"
          REPO_ID=$(curl -sSL --max-time 30 -G "$API/repositories/records" \
            --data-urlencode "filter=project=\"$PROJECT_ID\" && name=\"pocketbase\"" \
            --data-urlencode 'perPage=5' | jq -r '.items[0].id')
          echo "Repository ID: $REPO_ID"
          CHANNEL_ID=$(curl -sSL --max-time 30 -G "$API/channels/records" \
            --data-urlencode "filter=repository=\"$REPO_ID\" && name=\"default\"" \
            --data-urlencode 'perPage=5' | jq -r '.items[0].id')
          echo "Channel ID: $CHANNEL_ID"
          TAG=$(curl -sSL --max-time 30 -G "$API/releases/records" \
            --data-urlencode "filter=channel=\"$CHANNEL_ID\"" \
            --data-urlencode 'sort=-semver' \
            --data-urlencode 'perPage=1' | jq -r '.items[0].tag')
          echo "Latest tag: $TAG"
          VERSION="${TAG#v}"
          echo "Latest version: $VERSION"
          echo "result=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest package version
        id: package
        uses: actions/github-script@v9
        env:
          PACKAGE_NAME: pocketbase-docker
          PACKAGE_TYPE: container
        with:
          result-encoding: string
          script: |
            const {PACKAGE_NAME,PACKAGE_TYPE} = process.env;
            const owner = context.repo.owner;
            let packages = [];
            // Works for both org-owned (upstream) and user-owned (fork) GHCR packages.
            // Falls back to 0.0.0 when the package does not exist yet (first build).
            try {
              const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                org: owner,
                package_type: PACKAGE_TYPE,
                package_name: PACKAGE_NAME,
              });
              packages = res.data;
            } catch (orgErr) {
              if (orgErr.status !== 404) {
                core.warning(`Org package lookup failed: ${orgErr.message}, trying user lookup`);
              }
              try {
                const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  username: owner,
                  package_type: PACKAGE_TYPE,
                  package_name: PACKAGE_NAME,
                });
                packages = res.data;
              } catch (userErr) {
                if (userErr.status === 404) {
                  core.warning(`No existing package found for ${owner}/${PACKAGE_NAME}, forcing build`);
                  return '0.0.0';
                }
                throw userErr;
              }
            }

            if (!packages.length) {
              return '0.0.0';
            }

            const latest = packages.filter((p) =>
              p.metadata?.container?.tags?.includes("latest")
            )[0] || packages[0];

            const tags = latest.metadata?.container?.tags || [];
            return tags.find((v) => /^v?\d+\.\d+\.\d+$/.test(v)) || '0.0.0'

  test:
    runs-on: ubuntu-24.04
    needs: check
    if: (needs.check.outputs.pocketbase != needs.check.outputs.package) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ github.event.inputs.version || needs.check.outputs.pocketbase }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true

  release:
    runs-on: ubuntu-24.04
    needs: [check, test]
    if: (needs.check.outputs.pocketbase != needs.check.outputs.package) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from needs or input
        id: version
        run: echo "value=${{ github.event.inputs.version || needs.check.outputs.pocketbase }}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/philippdormann/pocketbase-docker
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
