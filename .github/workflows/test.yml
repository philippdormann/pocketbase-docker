name: Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest PocketBase release
        id: pocketbase
        run: |
          set -e
          API="https://ganigeorgiev.com/api/collections"
          PROJECT_ID=$(curl -sSL --max-time 30 -G "$API/projects/records" \
            --data-urlencode 'filter=name="pocketbase"' \
            --data-urlencode 'perPage=5' | jq -r '.items[0].id')
          REPO_ID=$(curl -sSL --max-time 30 -G "$API/repositories/records" \
            --data-urlencode "filter=project=\"$PROJECT_ID\" && name=\"pocketbase\"" \
            --data-urlencode 'perPage=5' | jq -r '.items[0].id')
          CHANNEL_ID=$(curl -sSL --max-time 30 -G "$API/channels/records" \
            --data-urlencode "filter=repository=\"$REPO_ID\" && name=\"default\"" \
            --data-urlencode 'perPage=5' | jq -r '.items[0].id')
          TAG=$(curl -sSL --max-time 30 -G "$API/releases/records" \
            --data-urlencode "filter=channel=\"$CHANNEL_ID\"" \
            --data-urlencode 'sort=-semver' \
            --data-urlencode 'perPage=1' | jq -r '.items[0].tag')
          VERSION="${TAG#v}"
          echo "Latest version: $VERSION"
          echo "result=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker tests
        run: cd tests && ./test.sh
        env:
          VERSION: ${{ steps.pocketbase.outputs.result }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker compose -f tests/compose.test.yaml logs || true
          echo "=== Container status ==="
          docker compose -f tests/compose.test.yaml ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/compose.test.yaml down -v --remove-orphans || true
          docker system prune -f || true
